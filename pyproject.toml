[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ha-axi"
version = "0.7.0"
description = "Agent eXperience Interface (AXI) CLI for Home Assistant: entity, area and device registry administration over the WebSocket API, and service calls that explain their refusals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["home-assistant", "home-automation", "cli", "axi", "agent", "registry", "websocket", "toon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "axi-toolkit>=0.3.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pyyaml>=6",
  "ruff>=0.5",
]

[project.scripts]
ha-axi = "ha_axi.cli:main"

[project.urls]
Homepage = "https://github.com/dmealing/ha-axi"
Source = "https://github.com/dmealing/ha-axi"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_axi"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ha_axi.*"]
